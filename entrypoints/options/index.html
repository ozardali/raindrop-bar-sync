<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raindrop Bar Sync</title>
    <meta name="manifest.open_in_tab" content="true" />
    <style>
      .page { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; display: grid; gap: 16px; }
      .hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
      .hero .brand img { width: 40px; height: 40px; }
      .hero .brand h1 { font-size: 22px; }
      .hero p { margin: 2px 0 0; }
      .hero-side { display: flex; align-items: center; gap: 10px; }
      .lang { width: auto; padding: 4px 8px; font-size: 13px; }

      .card h2 { font-size: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
      .step {
        width: 22px; height: 22px; border-radius: 50%; flex: none;
        display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
        background: var(--accent-soft); color: var(--accent);
      }
      .step.done { background: var(--ok-soft); color: var(--ok); }
      .card > p { margin: 0 0 14px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > input, .row > select { flex: 1; min-width: 0; }
      .meta { margin-top: 8px; }
      .meta:empty { display: none; }
      .guide { margin-top: 12px; background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
      .guide summary { cursor: pointer; font-weight: 600; color: var(--accent); }
      .guide ol { margin: 10px 0 6px; padding-left: 20px; display: grid; gap: 6px; }
      .guide p { margin: 6px 0 0; }
      .meta.ok { color: var(--ok); }
      .meta.error { color: var(--error); }

      .sync-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
      .stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
      .stat .value { font-size: 16px; font-weight: 650; margin-top: 2px; }
      .sync-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .sync-actions label { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
      .sync-actions input { width: 64px; }
      #result { margin-top: 12px; white-space: pre-line; }

      details.card { padding: 0; }
      details.card > summary { padding: 16px 20px; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
      details.card > summary::after { content: '▸'; color: var(--text-2); }
      details.card[open] > summary::after { content: '▾'; }
      details.card > .inner { padding: 0 20px 20px; }

      .trees { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .trees section { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 420px; }
      .trees h3 { font-size: 13px; margin-bottom: 2px; }
      .tree, .tree ul { list-style: none; margin: 0; padding-left: 16px; }
      .tree { padding-left: 0; margin-top: 8px; font-size: 13px; }
      .tree li { white-space: nowrap; line-height: 1.7; }
      .tree .url { color: var(--text-2); font-size: 11px; margin-left: 6px; }

      .devices { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 2px; }
      .devices li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
      .devices li:first-child { border-top: none; }
      .devices .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
      .devices .you { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }

      .log { margin: 0; padding: 0; list-style: none; display: grid; }
      .log > li { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13px; }
      .log > li:first-child { border-top: none; }
      .log .icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
      .log .sync .icon { background: var(--ok-soft); color: var(--ok); }
      .log .warn .icon, .log .paused .icon { background: var(--warn-soft); color: var(--warn); }
      .log .error .icon { background: var(--error-soft); color: var(--error); }
      .log .msg { align-self: center; min-width: 0; }
      .log .count { color: var(--text-2); font-size: 12px; margin-left: 4px; }
      .log time { color: var(--text-2); font-size: 12px; align-self: center; white-space: nowrap; }
      .log details { grid-column: 2 / 4; }
      .log details summary { cursor: pointer; color: var(--accent); font-size: 12px; }
      .log details ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); font-size: 12px; display: grid; gap: 2px; }
      .log .empty { display: block; color: var(--text-2); }

      @media (max-width: 640px) {
        .trees, .sync-grid { grid-template-columns: 1fr; }
        .sync-actions label { margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <div class="brand">
          <img src="/icon/128.png" alt="" />
          <div>
            <h1>Raindrop Bar Sync</h1>
            <p class="muted" data-i18n="app.tagline"></p>
          </div>
        </div>
        <div class="hero-side">
          <span id="pill" class="pill">…</span>
          <select id="language" class="lang" data-i18n-title="lang.label"></select>
        </div>
      </div>

      <section class="card">
        <h2><span id="step-1" class="step">1</span> <span data-i18n="account.title"></span></h2>
        <p id="account-help" class="muted"></p>
        <div class="row">
          <input id="token" type="password" autocomplete="off" data-i18n-placeholder="account.placeholder" />
          <button id="connect" class="btn primary" data-i18n="account.connect"></button>
        </div>
        <div id="connection" class="meta small"></div>
        <details id="token-guide" class="guide">
          <summary data-i18n="guide.title"></summary>
          <ol>
            <li id="guide-step1"></li>
            <li data-i18n="guide.step2"></li>
            <li data-i18n="guide.step3"></li>
            <li data-i18n="guide.step4"></li>
            <li data-i18n="guide.step5"></li>
          </ol>
          <p class="muted small" data-i18n="guide.note"></p>
        </details>
      </section>

      <section class="card">
        <h2><span id="step-2" class="step">2</span> <span data-i18n="collection.title"></span></h2>
        <p class="muted" data-i18n="collection.help"></p>
        <div class="row">
          <select id="collection" disabled></select>
          <button id="new-collection" class="btn" disabled data-i18n="collection.new"></button>
        </div>
      </section>

      <section class="card">
        <h2><span id="step-3" class="step">3</span> <span data-i18n="sync.title"></span></h2>
        <p class="muted" data-i18n="sync.help"></p>
        <div class="sync-grid">
          <div class="stat"><div class="muted small" data-i18n="sync.lastSync"></div><div id="last-sync" class="value">–</div></div>
          <div class="stat"><div class="muted small" data-i18n="sync.bookmarks"></div><div id="count-bookmarks" class="value">–</div></div>
          <div class="stat"><div class="muted small" data-i18n="sync.folders"></div><div id="count-folders" class="value">–</div></div>
        </div>
        <div id="notice" class="notice" hidden></div>
        <div class="sync-actions" style="margin-top: 12px">
          <button id="sync" class="btn primary" data-i18n="action.syncNow"></button>
          <button id="preview" class="btn" data-i18n="sync.preview"></button>
          <label id="interval-label"><input id="interval" type="number" min="1" max="30" value="1" /></label>
        </div>
        <div id="result" class="small muted"></div>
      </section>

      <section class="card">
        <h2 data-i18n="devices.title"></h2>
        <p class="muted" data-i18n="devices.help"></p>
        <div class="row">
          <input id="device-name" type="text" maxlength="40" />
          <button id="device-save" class="btn" data-i18n="devices.rename"></button>
        </div>
        <ul id="devices" class="devices"></ul>
      </section>

      <details class="card">
        <summary><span><span data-i18n="backups.title"></span> <span id="backup-count" class="muted small"></span></span></summary>
        <div class="inner">
          <p class="muted small" style="margin: 0 0 8px" data-i18n="backups.help"></p>
          <ul id="backups" class="devices"></ul>
        </div>
      </details>

      <div class="notice warn" data-i18n="warn.nativeSync"></div>

      <details class="card">
        <summary data-i18n="inspect.title"></summary>
        <div class="inner">
          <div class="row" style="justify-content: space-between; margin-bottom: 10px">
            <span class="muted small" data-i18n="inspect.help"></span>
            <button id="refresh-trees" class="btn" data-i18n="inspect.refresh"></button>
          </div>
          <div class="trees">
            <section>
              <h3 data-i18n="inspect.local"></h3>
              <div id="local-summary" class="muted small"></div>
              <ul id="local-tree" class="tree"></ul>
            </section>
            <section>
              <h3 data-i18n="inspect.remote"></h3>
              <div id="remote-summary" class="muted small"></div>
              <ul id="remote-tree" class="tree"></ul>
            </section>
          </div>
        </div>
      </details>

      <details id="log-card" class="card" open>
        <summary><span><span data-i18n="activity.title"></span> <span id="log-count" class="muted small"></span></span></summary>
        <div class="inner">
          <ul id="log" class="log"></ul>
          <div class="row" style="justify-content: flex-end; margin-top: 12px">
            <button id="log-clear" class="btn" data-i18n="activity.clear"></button>
          </div>
        </div>
      </details>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
